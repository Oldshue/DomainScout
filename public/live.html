<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live sites</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:16px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;color:#111;background:#fff}
main{max-width:640px;margin:0 auto;padding:12px}
.bar{display:flex;gap:8px;align-items:stretch;margin-bottom:6px}
#q{flex:1;min-width:0;padding:12px;font-size:16px;border:1px solid #ccc;border-radius:8px}
#ext{flex:none;max-width:140px;border:1px solid #ccc;border-radius:8px;background:#fff;font:inherit;font-size:13px;padding:0 6px}
#win{display:flex;border:1px solid #ccc;border-radius:8px;overflow:hidden;flex:none}
#win button{border:0;background:#fff;color:#333;font:inherit;font-size:13px;padding:0 10px;cursor:pointer}
#win button+button{border-left:1px solid #ccc}
#win button[aria-pressed="true"]{background:#0645ad;color:#fff}
#count{color:#555;font-size:13px;margin:0 2px 8px;min-height:18px}
ul{list-style:none;margin:0;padding:0}
li{padding:10px 8px;border-bottom:1px solid #eee;transition:background 3s}
li.new{background:#fff7c2}
a{color:#0645ad;font-weight:600;text-decoration:none;word-break:break-all}
.t{margin-top:2px}
.s{color:#333;font-size:13px;font-style:italic;margin-top:2px}
.d{color:#555;font-size:14px}
.m{color:#888;font-size:12px;margin-top:2px}
#exclude{width:100%;padding:9px 12px;margin:0 0 8px;font:inherit;font-size:14px;border:1px solid #ccc;border-radius:8px}
#empty{color:#666;padding:24px 8px;text-align:center}
@media(max-width:520px){.bar{flex-wrap:wrap}#q{flex-basis:100%}#ext{flex:1;max-width:none;min-height:42px}}
</style>
</head>
<body>
<main>
<section id="sites-view">
<div class="bar">
<input id="q" type="search" placeholder="Search" autocomplete="off" aria-label="Search">
<select id="ext" aria-label="Extension"><option value="">All extensions</option></select>
<div id="win" role="group" aria-label="Time window">
<button type="button" data-w="1d" aria-pressed="false">Past day</button>
<button type="button" data-w="2d" aria-pressed="true">2 days</button>
<button type="button" data-w="7d" aria-pressed="false">Week</button>
</div>
</div>
<input id="exclude" type="search" placeholder="Exclude (e.g. computer)" autocomplete="off" aria-label="Exclude">
<div id="count" aria-live="polite"></div>
<button id="retry" type="button" hidden>Retry loading sites</button>
<div id="live" class="m" hidden></div>
<ul id="list"></ul>
<div id="empty" hidden>No sites yet. This page updates itself.</div>
</section>
</main>
<script>
(function () {
  var API = '/api/public/live-sites';
  var WINDOWS = ['1d', '2d', '7d'];
  var WINDOW_DAYS = { '1d': 1, '2d': 2, '7d': 7 };
  var list = document.getElementById('list');
  var empty = document.getElementById('empty');
  var q = document.getElementById('q');
  var exclude = document.getElementById('exclude');
  var count = document.getElementById('count');
  var retry = document.getElementById('retry');
  var failed = false, polling = false;
  var requestTimeoutMs = Number(window.__DOMAINSCOUT_LIVE_REQUEST_TIMEOUT_MS) || 15000;
  var recoveryDelays = Array.isArray(window.__DOMAINSCOUT_LIVE_RECOVERY_DELAYS_MS)
    ? window.__DOMAINSCOUT_LIVE_RECOVERY_DELAYS_MS : [2000, 5000, 15000, 30000, 60000];
  var recoveryTimer = null, recoveryAttempt = 0;
  var extSel = document.getElementById('ext');
  var ext = '';
  var buttons = Array.prototype.slice.call(document.querySelectorAll('#win button'));
  var seen = {}, cursor = null, loading = false, done = false, gen = 0, projectionRefreshing = false;
  var viewController = new AbortController();
  var searchTimer = null;
  var win = '2d';
  try {
    var params = new URLSearchParams(location.search);
    q.value = new URLSearchParams(location.search).get('q') || '';
    exclude.value = params.get('exclude') || '';
    var w = params.get('window');
    if (WINDOWS.indexOf(w) !== -1) win = w;
    var e = (params.get('ext') || '').toLowerCase().replace(/^\./, '');
    if (/^[a-z0-9-]{1,63}$/.test(e)) ext = e;
  } catch (e) {}

  function syncButtons() {
    buttons.forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-w') === win ? 'true' : 'false'); });
  }
  function syncUrl() {
    var v = q.value.trim();
    try { history.replaceState(null, '', '/live?' + (v ? 'q=' + encodeURIComponent(v) + '&' : '') + 'window=' + win + (ext ? '&ext=' + encodeURIComponent(ext) : '') + (exclude.value.trim() ? '&exclude=' + encodeURIComponent(exclude.value.trim()) : '')); } catch (e) {}
  }
  function setZones(zones) {
    if (!Array.isArray(zones)) return;
    var present = false;
    var PINNED = ['com', 'ai', 'si', 'io', 'bot', 'sh', 'dev'];
    var counts = {};
    zones.forEach(function (z) { counts[z.zone] = z.count; });
    extSel.textContent = '';
    var all = document.createElement('option'); all.value = ''; all.textContent = 'All extensions'; extSel.appendChild(all);
    PINNED.forEach(function (p) {
      var o = document.createElement('option'); o.value = p;
      o.textContent = '.' + p + ' (' + Number(counts[p] || 0).toLocaleString('en-US') + ')';
      if (p === ext) present = true;
      extSel.appendChild(o);
    });
    var sep = document.createElement('option'); sep.disabled = true; sep.textContent = '────────'; extSel.appendChild(sep);
    zones.forEach(function (z) {
      if (PINNED.indexOf(z.zone) !== -1) return;
      var o = document.createElement('option'); o.value = z.zone;
      o.textContent = '.' + z.zone + ' (' + Number(z.count).toLocaleString('en-US') + ')';
      if (z.zone === ext) present = true;
      extSel.appendChild(o);
    });
    if (ext && !present) { var o2 = document.createElement('option'); o2.value = ext; o2.textContent = '.' + ext; extSel.appendChild(o2); }
    extSel.value = ext;
  }
  function setTotal(n, refreshing) {
    if (typeof n !== 'number') return;
    count.textContent = n.toLocaleString('en-US') + (n === 1 ? ' site' : ' sites')
      + (refreshing ? ' · verified subset, updating…' : '');
  }
  var liveEl = document.getElementById('live');
  function setLive(l) {
    if (!l || l.status === 'off') { liveEl.hidden = true; return; }
    var text = 'live';
    if (l.status === 'stale') text = 'live feed delayed';
    if (l.status === 'degraded') text = 'live feed degraded';
    else if (l.status === 'starting') text = 'live: starting';
    else if (l.status === 'catching-up') text = 'live: catching up';
    if (l.lastLaunchAt) {
      var mins = Math.max(0, Math.round((Date.now() - Date.parse(l.lastLaunchAt)) / 60000));
      text += ': last launch ' + (mins < 1 ? 'just now' : mins < 120 ? mins + ' min ago' : Math.round(mins / 60) + ' h ago');
    } else if (l.status === 'live') text += l.warmingUp ? ': warming up' : ': waiting for first launch';
    liveEl.textContent = text;
    liveEl.hidden = false;
  }
  function render(s, fresh) {
    var li = document.createElement('li');
    if (fresh) { li.className = 'new'; setTimeout(function () { li.className = ''; }, 4000); }
    var a = document.createElement('a');
    a.href = s.url || ('https://' + s.domain);
    a.target = '_blank'; a.rel = 'noopener noreferrer';
    a.textContent = s.domain;
    li.appendChild(a);
    function line(cls, text) { if (!text) return; var d = document.createElement('div'); d.className = cls; d.textContent = text; li.appendChild(d); }
    line('t', s.title);
    // Why the row matched when q hit only the page text (feed sends snippet then).
    line('s', s.snippet);
    line('d', s.description);
    line('m', [s.day, s.zone ? '.' + String(s.zone).replace(/^\./, '') : ''].filter(Boolean).join(' · '));
    return li;
  }
  function refreshEmpty() {
    empty.textContent = projectionRefreshing
      ? ((q.value.trim() || exclude.value.trim()) ? 'No matches in the verified subset yet. Updating…' : 'Verified sites are still updating…')
      : ((q.value.trim() || exclude.value.trim()) ? 'No matching sites in this window.' : 'No sites yet. This page updates itself.');
    empty.hidden = list.children.length > 0;
  }
  function abortError() {
    var error = new Error('Live sites request cancelled');
    error.name = 'AbortError';
    return error;
  }
  function deadlineError() {
    var error = new Error('Live sites request exceeded its deadline');
    error.name = 'RequestDeadlineError';
    error.code = 'REQUEST_DEADLINE';
    return error;
  }
  function fetchPage(c, scopeSignal) {
    var url = API + '?limit=50&window=' + encodeURIComponent(win);
    var v = q.value.trim();
    if (v) url += '&q=' + encodeURIComponent(v);
    if (exclude.value.trim()) url += '&exclude=' + encodeURIComponent(exclude.value.trim());
    if (ext) url += '&zone=' + encodeURIComponent(ext);
    if (c) url += '&cursor=' + encodeURIComponent(c);
    var controller = new AbortController();
    var settled = false, deadlineExpired = false;
    var timeout;
    var cancel = function () { controller.abort(); };
    if (scopeSignal) {
      if (scopeSignal.aborted) return Promise.reject(abortError());
      scopeSignal.addEventListener('abort', cancel, { once: true });
    }
    var request = fetch(url, { signal: controller.signal, headers: { accept: 'application/json' } })
      .then(function (r) { if (!r.ok) throw new Error(String(r.status)); return r.json(); })
      .then(function (d) {
        if (!d || !Array.isArray(d.items) || !Number.isFinite(Number(d.total)) || Number(d.total) < 0 || !Array.isArray(d.zones)) throw new Error('Live sites response was incomplete');
        return d;
      })
      .catch(function (error) { if (deadlineExpired && error && error.name === 'AbortError') throw deadlineError(); throw error; });
    var deadline = new Promise(function (_, reject) {
      timeout = setTimeout(function () {
        deadlineExpired = true;
        reject(deadlineError());
        controller.abort();
      }, requestTimeoutMs);
    });
    return Promise.race([request, deadline]).finally(function () {
      if (settled) return;
      settled = true;
      clearTimeout(timeout);
      if (scopeSignal) scopeSignal.removeEventListener('abort', cancel);
    });
  }
  function clearRecovery() {
    if (recoveryTimer !== null) clearTimeout(recoveryTimer);
    recoveryTimer = null;
  }
  function scheduleRecovery(my) {
    if (my !== gen || recoveryTimer !== null) return;
    var index = Math.min(recoveryAttempt, recoveryDelays.length - 1);
    var delay = Math.max(1, Number(recoveryDelays[index]) || 60000);
    recoveryAttempt += 1;
    recoveryTimer = setTimeout(function () {
      recoveryTimer = null;
      if (my !== gen) return;
      if (document.hidden) { scheduleRecovery(my); return; }
      failed = false;
      retry.hidden = true;
      more();
    }, delay);
  }
  function more() {
    if (loading || done || failed) return;
    loading = true;
    if (!list.children.length) count.textContent = 'Loading sites…';
    var my = gen;
    fetchPage(cursor, viewController.signal).then(function (d) {
      if (my !== gen) return;
      clearRecovery(); recoveryAttempt = 0; failed = false; retry.hidden = true;
      (d.items || []).forEach(function (s) {
        if (seen[s.domain]) return;
        seen[s.domain] = 1; list.appendChild(render(s, false));
      });
      cursor = d.nextCursor || null; done = !cursor;
      projectionRefreshing = d.projection && d.projection.status === 'refreshing';
      setTotal(d.total, projectionRefreshing); setZones(d.zones); setLive(d.live);
      refreshEmpty();
    }).catch(function (error) {
      if (my !== gen || (error.name === 'AbortError' && viewController.signal.aborted)) return;
      failed = true;
      count.textContent = list.children.length
        ? 'Showing last verified sites while reconnecting…'
        : 'Sites temporarily unavailable. Retrying automatically…';
      retry.hidden = false;
      scheduleRecovery(my);
    }).finally(function () { if (my === gen) { loading = false; check(); } });
  }
  function check() {
    if (!failed && !document.hidden && !done && !loading && window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 400) more();
  }
  function poll() {
    if (document.hidden || loading || polling || failed) return;
    polling = true;
    var my = gen;
    fetchPage(null, viewController.signal).then(function (d) {
      if (my !== gen) return;
      var anchor = Array.prototype.find.call(list.children, function (li) { return li.getBoundingClientRect().bottom > 0; });
      var anchorTop = anchor && anchor.getBoundingClientRect().top;
      var preserveScroll = window.scrollY > 0;
      var fresh = (d.items || []).filter(function (s) { return !seen[s.domain]; });
      for (var i = fresh.length - 1; i >= 0; i--) {
        seen[fresh[i].domain] = 1;
        list.insertBefore(render(fresh[i], true), list.firstChild);
      }
      if (preserveScroll && anchor) window.scrollBy(0, anchor.getBoundingClientRect().top - anchorTop);
      projectionRefreshing = d.projection && d.projection.status === 'refreshing';
      setTotal(d.total, projectionRefreshing); setZones(d.zones); setLive(d.live);
      refreshEmpty();
    }).catch(function (error) {
      if (my !== gen || (error.name === 'AbortError' && viewController.signal.aborted)) return;
      if (!list.children.length) {
        failed = true;
        count.textContent = 'Sites temporarily unavailable. Retrying automatically…';
        retry.hidden = false;
        scheduleRecovery(my);
      }
    }).finally(function () { polling = false; });
  }
  function reset(options) {
    var keepRows = !!(options && options.keepRows);
    gen += 1;
    viewController.abort();
    viewController = new AbortController();
    clearRecovery(); recoveryAttempt = 0;
    if (!keepRows) { seen = {}; list.textContent = ''; }
    cursor = null; loading = false; done = false; failed = false; projectionRefreshing = false; retry.hidden = true;
    count.textContent = keepRows ? 'Showing verified sites while expanding the time window…' : '';
    empty.hidden = true;
    syncUrl();
    more();
  }
  retry.addEventListener('click', function () { clearRecovery(); recoveryAttempt = 0; failed = false; retry.hidden = true; more(); });
  [q, exclude].forEach(function (input) {
    input.addEventListener('input', function () {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(reset, 250);
    });
  });
  extSel.addEventListener('change', function () { ext = extSel.value; reset(); });
  buttons.forEach(function (b) {
    b.addEventListener('click', function () {
      var next = b.getAttribute('data-w');
      if (next === win) return;
      var keepRows = WINDOW_DAYS[next] > WINDOW_DAYS[win] && list.children.length > 0;
      win = next; syncButtons(); reset({ keepRows: keepRows });
    });
  });
  window.addEventListener('scroll', check, { passive: true });
  window.addEventListener('resize', check);
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) return;
    if (failed) { clearRecovery(); failed = false; retry.hidden = true; more(); }
    else check();
  });
  setZones([]);
  syncButtons();
  syncUrl();
  more();
  setInterval(poll, Number(window.__DOMAINSCOUT_LIVE_POLL_MS) || 20000);
})();
</script>

</body>
</html>
